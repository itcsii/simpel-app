<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Psikotes SIMPEL</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body { font-family: Arial; background:#f2f2f2; padding:20px; }
.card { background:white; padding:20px; border-radius:12px; margin-top:20px; }
button { width:100%; padding:12px; background:#2a9d8f; color:white; border:0; border-radius:8px; }
.error { color:red; font-weight:bold; }
</style>
</head>

<body>

<h2>Psikotes SIMPEL</h2>

<p id="userInfo">Memuat...</p>
<p id="timerBox"></p>

<div class="card" id="content"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const userInfo = document.getElementById("userInfo");
const content = document.getElementById("content");
const timerBox = document.getElementById("timerBox");

const PERIODE_ID = "uat-2026-05";

// AUTH CHECK
auth.onAuthStateChanged(async user => {
  if (!user) {
    alert("Login dulu");
    location.href = "index.html";
    return;
  }

  userInfo.innerText = "Login sebagai: " + user.email;

  const lamaranId = user.uid + "_" + PERIODE_ID;
  const doc = await db.collection("lamaran").doc(lamaranId).get();

  if (!doc.exists) {
    content.innerHTML = "<p class='error'>Lamaran tidak ditemukan.</p>";
    return;
  }

  const data = doc.data();

  // ❌ BLOCK jika belum lolos
  if (data.tahap !== "psikotes_aktif") {
    content.innerHTML = `
      <p class="error">Psikotes belum aktif atau sudah selesai.</p>
      <p>Tahap saat ini: ${data.tahap}</p>
      <button onclick="location.href='lamaran.html'">Kembali</button>
    `;
    return;
  }

  // ✅ HANYA DI SINI TIMER MUNCUL
  let timeLeft = 60;
  timerBox.innerText = "Sisa waktu: " + timeLeft + " detik";

  const timer = setInterval(() => {
    timeLeft--;
    timerBox.innerText = "Sisa waktu: " + timeLeft + " detik";

    if (timeLeft <= 0) {
      clearInterval(timer);
      submitTest(user, data, "gagal_psikotes");
    }
  }, 1000);

  // TAMPILKAN SOAL
  content.innerHTML = `
    <p>Soal: 2 + 2 = ?</p>
    <input id="jawaban" placeholder="Jawaban">
    <br><br>
    <button onclick="kirim('${user.uid}', '${data.email}', '${data.lowongan}', '${data.lowonganId}')">Kirim</button>
  `;
});

// SUBMIT MANUAL
async function kirim(uid, email, lowongan, lowonganId) {
  const jawaban = document.getElementById("jawaban").value;
  const hasil = jawaban == "4" ? "lolos_psikotes" : "gagal_psikotes";

  submitTest({uid, email}, {lowongan, lowonganId}, hasil);
}

// SIMPAN HASIL
async function submitTest(user, data, hasil) {
  const lamaranId = user.uid + "_" + PERIODE_ID;

  try {
    // simpan hasil psikotes
    await db.collection("psikotes").add({
      uid: user.uid,
      email: user.email,
      lowongan: data.lowongan,
      hasil: hasil,
      createdAt: new Date()
    });

    // update lamaran
    await db.collection("lamaran").doc(lamaranId).update({
      tahap: hasil,
      updatedAt: new Date()
    });

    alert("Tes selesai: " + hasil);
    location.href = "lamaran.html";

  } catch (e) {
    alert("Error: " + e.message);
  }
}
</script>

</body>
</html>
