<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin HR SIMPEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
h2{margin-bottom:6px}
.card{background:white;padding:16px;margin-bottom:12px;border-radius:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{display:inline-block;background:#2a9d8f;color:white;padding:5px 8px;border-radius:6px;font-size:12px}
button{border:0;border-radius:7px;padding:10px 12px;color:white;font-weight:bold;margin:4px 2px}
.btn-main{background:#2a9d8f}
.btn-gray{background:#6b7280}
.btn-green{background:#16a34a}
.btn-red{background:#dc2626}
.btn-blue{background:#2563eb}
.btn-disabled{background:#9ca3af}
.detail{display:none;margin-top:12px;border-top:1px solid #ddd;padding-top:10px}
.pagination{margin-top:18px;display:flex;gap:8px;align-items:center}
select{padding:10px;border-radius:8px;border:1px solid #ccc;margin:8px 0;width:100%}
.small{font-size:13px;color:#555}
</style>
</head>

<body>

<h2>Admin HR SIMPEL</h2>
<p id="adminInfo">Memeriksa akses admin...</p>

<p><strong>Periode aktif:</strong> UAT Mei 2026</p>

<select id="filterTahap" onchange="applyFilter()">
  <option value="all">Semua tahap</option>
  <option value="menunggu_review_berkas">Menunggu Review Berkas</option>
  <option value="lolos_berkas">Lolos Berkas</option>
  <option value="tidak_lolos_berkas">Tidak Lolos Berkas</option>
  <option value="psikotes_aktif">Psikotes Aktif</option>
  <option value="lolos_psikotes">Lolos Psikotes</option>
  <option value="gagal_psikotes">Gagal Psikotes</option>
</select>

<button class="btn-main" onclick="loadLamaran()">Refresh Data</button>
<button class="btn-gray" onclick="logout()">Logout</button>

<p id="status">Memuat data...</p>
<div id="list"></div>

<div class="pagination">
  <button class="btn-gray" onclick="prevPage()">Prev</button>
  <span id="pageInfo">Page 1</span>
  <button class="btn-gray" onclick="nextPage()">Next</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
/*
  ================================
  1. KONFIGURASI PERIODE
  ================================
  Admin hanya melihat lamaran untuk periode aktif.
*/
const PERIODE_ID = "uat-2026-05";
const PERIODE_NAMA = "UAT Mei 2026";

/*
  ================================
  2. KONFIGURASI PAGINATION
  ================================
  Karena HP susah scroll panjang, data dibagi per halaman.
*/
const PAGE_SIZE = 5;
let currentPage = 1;
let allLamaran = [];
let filteredLamaran = [];

/*
  ================================
  3. FIREBASE CONFIG
  ================================
*/
const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90",
  measurementId: "G-NRWP6W84QE"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const adminInfo = document.getElementById("adminInfo");
const statusBox = document.getElementById("status");
const listBox = document.getElementById("list");
const pageInfo = document.getElementById("pageInfo");

let currentAdmin = null;
let currentAdminRole = null;

/*
  ================================
  4. CEK LOGIN ADMIN
  ================================
  User hanya boleh masuk admin.html jika punya role admin/superadmin.
*/
auth.onAuthStateChanged(async function(user) {
  if (!user) {
    alert("Silakan login dulu.");
    window.location.href = "index.html?v=admin-clean1";
    return;
  }

  const userDoc = await db.collection("users").doc(user.uid).get();

  if (!userDoc.exists) {
    adminInfo.innerHTML = "Akses ditolak. Akun ini belum punya role admin.";
    statusBox.innerText = "";
    return;
  }

  const userData = userDoc.data();

  if (userData.role !== "admin" && userData.role !== "superadmin") {
    adminInfo.innerHTML = "Akses ditolak. Role kamu bukan admin.";
    statusBox.innerText = "";
    return;
  }

  currentAdmin = user;
  currentAdminRole = userData.role;

  adminInfo.innerText = "Login admin: " + user.email + " | Role: " + currentAdminRole;

  loadLamaran();
});

/*
  ================================
  5. LOAD LAMARAN PER PERIODE
  ================================
  Hanya ambil data periode aktif agar data lama tidak bercampur.
*/
async function loadLamaran() {
  if (!currentAdmin) {
    statusBox.innerText = "Admin belum valid.";
    return;
  }

  statusBox.innerText = "Memuat lamaran periode aktif...";
  listBox.innerHTML = "";

  try {
    const snapshot = await db.collection("lamaran")
      .where("periodeId", "==", PERIODE_ID)
      .get();

    allLamaran = [];

    snapshot.forEach(doc => {
      allLamaran.push({
        id: doc.id,
        data: doc.data()
      });
    });

    currentPage = 1;
    applyFilter();

  } catch (error) {
    statusBox.innerText = "Error: " + error.message;
  }
}

/*
  ================================
  6. FILTER TAHAP
  ================================
  Admin bisa filter status/tahap tanpa reload Firestore.
*/
function applyFilter() {
  const filter = document.getElementById("filterTahap").value;

  if (filter === "all") {
    filteredLamaran = allLamaran;
  } else {
    filteredLamaran = allLamaran.filter(item => item.data.tahap === filter);
  }

  currentPage = 1;
  renderPage();
}

/*
  ================================
  7. RENDER PAGINATION
  ================================
  Menampilkan hanya PAGE_SIZE data per halaman.
*/
function renderPage() {
  listBox.innerHTML = "";

  const total = filteredLamaran.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageItems = filteredLamaran.slice(start, end);

  statusBox.innerText = "Total lamaran periode aktif: " + total;
  pageInfo.innerText = "Page " + currentPage + " / " + totalPages;

  if (pageItems.length === 0) {
    listBox.innerHTML = "<p>Tidak ada data.</p>";
    return;
  }

  pageItems.forEach(item => {
    renderCard(item.id, item.data);
  });
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    renderPage();
  }
}

function nextPage() {
  const totalPages = Math.max(1, Math.ceil(filteredLamaran.length / PAGE_SIZE));
  if (currentPage < totalPages) {
    currentPage++;
    renderPage();
  }
}

/*
  ================================
  8. RENDER CARD LAMARAN
  ================================
  Card dibuat ringkas.
  Detail dan tombol aksi muncul hanya jika user klik "Detail".
*/
function renderCard(lamaranId, data) {
  const div = document.createElement("div");
  div.className = "card";

  const detailId = "detail-" + lamaranId.replaceAll("/", "-");

  div.innerHTML = `
    <div class="row">
      <div>
        <h3>${data.lowongan || "-"}</h3>
        <p class="small">${data.email || "-"}</p>
      </div>
      <span class="badge">${data.tahap || "-"}</span>
    </div>

    <button class="btn-main" onclick="toggleDetail('${detailId}')">Detail</button>

    <div class="detail" id="${detailId}">
      <p><strong>Periode:</strong> ${data.periodeNama || "-"}</p>
      <p><strong>Status:</strong> ${data.status || "-"}</p>
      <p><strong>Tahap:</strong> ${data.tahap || "-"}</p>
      <p><strong>Nilai Psikotes:</strong> ${data.nilaiPsikotes || "-"}</p>
      <p><strong>Reviewed By:</strong> ${data.reviewedByEmail || "-"}</p>

      ${renderActionButtons(lamaranId, data)}
    </div>
  `;

  listBox.appendChild(div);
}

/*
  ================================
  9. ACCORDION DETAIL
  ================================
*/
function toggleDetail(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

/*
  ================================
  10. LOCK WORKFLOW
  ================================
  Tombol admin hanya muncul sesuai tahap yang valid.
*/
function renderActionButtons(lamaranId, data) {
  const tahap = data.tahap || "";

  if (tahap === "menunggu_review_berkas") {
    return `
      <button class="btn-green" onclick="updateStatus('${lamaranId}', 'aktif', 'lolos_berkas', 'APPROVE_BERKAS')">
        Lolos Berkas
      </button>
      <button class="btn-red" onclick="updateStatus('${lamaranId}', 'ditolak', 'tidak_lolos_berkas', 'REJECT_BERKAS')">
        Tolak Berkas
      </button>
    `;
  }

  if (tahap === "lolos_berkas") {
    return `
      <button class="btn-blue" onclick="updateStatus('${lamaranId}', 'aktif', 'psikotes_aktif', 'AKTIFKAN_PSIKOTES')">
        Aktifkan Psikotes
      </button>
    `;
  }

  if (tahap === "psikotes_aktif") {
    return `<button class="btn-disabled" disabled>Menunggu pelamar mengerjakan psikotes</button>`;
  }

  if (tahap === "lolos_psikotes") {
    return `<button class="btn-disabled" disabled>Pelamar lolos psikotes</button>`;
  }

  if (tahap === "gagal_psikotes") {
    return `<button class="btn-disabled" disabled>Pelamar gagal psikotes</button>`;
  }

  if (tahap === "tidak_lolos_berkas") {
    return `<button class="btn-disabled" disabled>Proses berhenti: tidak lolos berkas</button>`;
  }

  return `<button class="btn-disabled" disabled>Tahap tidak dikenali</button>`;
}

/*
  ================================
  11. UPDATE STATUS + AUDIT TRAIL
  ================================
  Setiap approval disimpan ke audit_logs.
*/
async function updateStatus(lamaranId, statusBaru, tahapBaru, actionName) {
  if (!currentAdmin) {
    alert("Admin belum valid.");
    return;
  }

  try {
    const lamaranRef = db.collection("lamaran").doc(lamaranId);
    const beforeSnap = await lamaranRef.get();

    if (!beforeSnap.exists) {
      alert("Data lamaran tidak ditemukan.");
      return;
    }

    const beforeData = beforeSnap.data();

    /*
      Validasi workflow sebelum update.
      Ini mencegah admin klik aksi yang tidak sesuai tahap.
    */
    if (actionName === "APPROVE_BERKAS" && beforeData.tahap !== "menunggu_review_berkas") {
      alert("Aksi tidak valid. Hanya bisa approve dari tahap menunggu_review_berkas.");
      return;
    }

    if (actionName === "REJECT_BERKAS" && beforeData.tahap !== "menunggu_review_berkas") {
      alert("Aksi tidak valid. Hanya bisa reject dari tahap menunggu_review_berkas.");
      return;
    }

    if (actionName === "AKTIFKAN_PSIKOTES" && beforeData.tahap !== "lolos_berkas") {
      alert("Aksi tidak valid. Psikotes hanya bisa diaktifkan setelah lolos berkas.");
      return;
    }

    await lamaranRef.update({
      status: statusBaru,
      tahap: tahapBaru,
      reviewedByUid: currentAdmin.uid,
      reviewedByEmail: currentAdmin.email,
      reviewedAt: new Date(),
      updatedAt: new Date()
    });

    await db.collection("audit_logs").add({
      actorUid: currentAdmin.uid,
      actorEmail: currentAdmin.email,
      actorRole: currentAdminRole,

      action: actionName,

      targetCollection: "lamaran",
      targetId: lamaranId,

      pelamarEmail: beforeData.email || "-",
      lowongan: beforeData.lowongan || "-",
      periodeId: beforeData.periodeId || "-",
      periodeNama: beforeData.periodeNama || "-",

      beforeStatus: beforeData.status || "-",
      beforeTahap: beforeData.tahap || "-",

      afterStatus: statusBaru,
      afterTahap: tahapBaru,

      createdAt: new Date()
    });

    alert("Status berhasil diubah dan audit trail tersimpan.");
    loadLamaran();

  } catch (error) {
    alert("Error: " + error.message);
  }
}

/*
  ================================
  12. LOGOUT ADMIN
  ================================
*/
function logout() {
  auth.signOut().then(() => {
    window.location.href = "index.html?v=admin-clean1";
  });
}
</script>

</body>
</html>
