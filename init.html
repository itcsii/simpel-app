<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Init SIMPEL</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
.card{max-width:420px;margin:60px auto;background:white;padding:24px;border-radius:14px;text-align:center}
button{width:100%;padding:14px;background:#14b8a6;color:white;border:0;border-radius:10px;font-weight:bold}
#status{margin-top:18px}
</style>
</head>
<body>

<div class="card">
  <h2>Init Data UAT SIMPEL</h2>
  <p>Tekan tombol ini sekali saja untuk membuat data awal.</p>
  <button onclick="initData()">Buat Data UAT</button>
  <div id="status">Siap.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const status = document.getElementById("status");

window.initData = async () => {
  try {
    status.innerText = "Membuat settings...";

    await setDoc(doc(db, "settings", "default"), {
      appName: "SIMPEL",
      companyName: "Can Sports Industrial",
      tagline: "Sistem Informasi Manajemen Pelamar",
      themeColor: "#14b8a6",
      createdAt: serverTimestamp()
    });

    status.innerText = "Membuat lowongan...";

    await setDoc(doc(db, "lowongan", "staff-it"), {
      judul: "Staff IT",
      departemen: "IT",
      deskripsi: "Mengelola sistem internal perusahaan.",
      status: "open",
      kuota: 2,
      createdAt: serverTimestamp()
    });

    await setDoc(doc(db, "lowongan", "qc-line-assembling"), {
      judul: "QC Line Assembling",
      departemen: "QC",
      deskripsi: "Melakukan pemeriksaan kualitas pada line assembling.",
      status: "open",
      kuota: 5,
      createdAt: serverTimestamp()
    });

    await setDoc(doc(db, "lowongan", "purchasing"), {
      judul: "Purchasing",
      departemen: "Purchasing",
      deskripsi: "Mengelola proses pembelian dan administrasi vendor.",
      status: "open",
      kuota: 1,
      createdAt: serverTimestamp()
    });

    status.innerText = "✅ Data UAT berhasil dibuat.";
  } catch (e) {
    status.innerText = "❌ " + e.message;
  }
};
</script>

</body>
</html>
