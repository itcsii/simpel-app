<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body { font-family: Arial; background:#f4f6f8; padding:20px; }
    .card { background:white; padding:15px; margin-bottom:15px; border-radius:10px; }
    button { padding:10px; background:#26a69a; color:white; border:none; border-radius:6px; }
    #status { margin-top:10px; }
  </style>
</head>

<body>

<h2>Dashboard Lowongan</h2>

<div class="card">
  <h3>Purchasing</h3>
  <p>Administrasi vendor</p>
  <button onclick="apply('purchasing')">Apply</button>
</div>

<div class="card">
  <h3>QC Line Assembling</h3>
  <p>Quality control</p>
  <button onclick="apply('qc')">Apply</button>
</div>

<div class="card">
  <h3>Staff IT</h3>
  <p>Support IT</p>
  <button onclick="apply('it')">Apply</button>
</div>

<div id="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.appspot.com",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const status = document.getElementById("status");

window.apply = async (job) => {
  try {
    const user = auth.currentUser;

    if (!user) {
      status.innerText = "❌ Belum login";
      return;
    }

    await addDoc(collection(db, "lamaran"), {
      uid: user.uid,
      email: user.email,
      lowongan: job,
      status: "apply",
      createdAt: serverTimestamp()
    });

    status.innerText = "✅ Lamaran berhasil dikirim";
  } catch (e) {
    status.innerText = "❌ " + e.message;
  }
};
</script>

</body>
</html>
