<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard SIMPEL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    button {
      background: #2a9d8f;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    button:disabled {
      background: #9ca3af;
    }

    #status {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Dashboard Lowongan</h2>
<p id="userInfo">Memuat user...</p>

<div class="card">
  <h3>Purchasing</h3>
  <p>Mengelola proses pembelian dan administrasi vendor.</p>
  <button id="btn-purchasing" onclick="applyJob('purchasing', 'Purchasing')">Apply</button>
</div>

<div class="card">
  <h3>QC Line Assembling</h3>
  <p>Melakukan pemeriksaan kualitas pada line assembling.</p>
  <button id="btn-qc-line-assembling" onclick="applyJob('qc-line-assembling', 'QC Line Assembling')">Apply</button>
</div>

<div class="card">
  <h3>Staff IT</h3>
  <p>Mengelola sistem internal perusahaan.</p>
  <button id="btn-staff-it" onclick="applyJob('staff-it', 'Staff IT')">Apply</button>
</div>

<div id="status">Siap.</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90",
  measurementId: "G-NRWP6W84QE"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const statusBox = document.getElementById("status");

let currentUser = null;

auth.onAuthStateChanged(async function(user) {
  if (!user) {
    alert("Belum login.");
    window.location.href = "index.html?v=uat4";
    return;
  }

  currentUser = user;
  document.getElementById("userInfo").innerText = "Login sebagai: " + user.email;

  await cekLamaranUser();
});

async function cekLamaranUser() {
  const jobs = [
    { id: "purchasing", buttonId: "btn-purchasing" },
    { id: "qc-line-assembling", buttonId: "btn-qc-line-assembling" },
    { id: "staff-it", buttonId: "btn-staff-it" }
  ];

  for (const job of jobs) {
    const lamaranId = currentUser.uid + "_" + job.id;
    const docRef = db.collection("lamaran").doc(lamaranId);
    const docSnap = await docRef.get();

    if (docSnap.exists) {
      const btn = document.getElementById(job.buttonId);
      btn.innerText = "Sudah melamar";
      btn.disabled = true;
    }
  }
}

async function applyJob(jobId, jobName) {
  if (!currentUser) {
    statusBox.innerText = "Belum login.";
    return;
  }

  const lamaranId = currentUser.uid + "_" + jobId;
  const docRef = db.collection("lamaran").doc(lamaranId);

  try {
    statusBox.innerText = "Mengecek lamaran...";

    const docSnap = await docRef.get();

    if (docSnap.exists) {
      statusBox.innerText = "Kamu sudah melamar posisi " + jobName + ".";
      const btn = document.getElementById("btn-" + jobId);
      btn.innerText = "Sudah melamar";
      btn.disabled = true;
      return;
    }

    await docRef.set({
      uid: currentUser.uid,
      email: currentUser.email,
      lowonganId: jobId,
      lowongan: jobName,
      status: "melamar",
      createdAt: new Date()
    });

    statusBox.innerText = "✅ Lamaran " + jobName + " berhasil dikirim.";

    const btn = document.getElementById("btn-" + jobId);
    btn.innerText = "Sudah melamar";
    btn.disabled = true;

  } catch (err) {
    statusBox.innerText = "Error: " + err.message;
  }
}
</script>

</body>
</html>
