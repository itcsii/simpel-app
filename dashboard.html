<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard SIMPEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:12px}
button{background:#2a9d8f;color:white;border:0;padding:11px 14px;border-radius:8px;font-weight:bold}
button:disabled{background:#9ca3af}
#status{font-weight:bold;margin-top:15px}
</style>
</head>

<body>

<h2>Dashboard Lowongan</h2>
<p id="userInfo">Memuat user...</p>
<p><strong>Periode:</strong> UAT Mei 2026</p>

<a href="lamaran.html?v=role1">
  <button>Lihat Lamaran Saya</button>
</a>

<div id="jobs"></div>
<div id="status">Memeriksa akses...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
/*
  ================================
  1. KONFIGURASI PERIODE
  ================================
  Satu user hanya boleh punya satu lamaran pada periode ini.
*/
const PERIODE_ID = "uat-2026-05";
const PERIODE_NAMA = "UAT Mei 2026";

/*
  ================================
  2. FIREBASE CONFIG
  ================================
*/
const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90",
  measurementId: "G-NRWP6W84QE"
};

/*
  ================================
  3. INISIALISASI FIREBASE
  ================================
*/
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const jobsBox = document.getElementById("jobs");
const statusBox = document.getElementById("status");
const userInfo = document.getElementById("userInfo");

let currentUser = null;

/*
  ================================
  4. DATA LOWONGAN SEMENTARA
  ================================
  Untuk UAT masih statis.
  Nanti bisa ditarik dari collection lowongan.
*/
const jobs = [
  {
    id: "purchasing",
    nama: "Purchasing",
    deskripsi: "Mengelola proses pembelian dan administrasi vendor."
  },
  {
    id: "qc-line-assembling",
    nama: "QC Line Assembling",
    deskripsi: "Melakukan pemeriksaan kualitas pada line assembling."
  },
  {
    id: "staff-it",
    nama: "Staff IT",
    deskripsi: "Mengelola sistem internal perusahaan."
  }
];

/*
  ================================
  5. CEK LOGIN + ROLE
  ================================
  Alur:
  - Kalau belum login → balik ke index
  - Kalau role admin/superadmin → pindah ke admin.html
  - Kalau user biasa → tampil dashboard pelamar
*/
auth.onAuthStateChanged(async function(user) {
  if (!user) {
    alert("Belum login.");
    window.location.href = "index.html?v=role1";
    return;
  }

  currentUser = user;
  userInfo.innerText = "Login sebagai: " + user.email;
  statusBox.innerText = "Memeriksa role user...";

  /*
    Cek apakah user punya role di collection users.
    Jika document users/{uid} ada dan role admin/superadmin,
    berarti dia tidak boleh masuk dashboard pelamar.
  */
  const roleDoc = await db.collection("users").doc(user.uid).get();

  if (roleDoc.exists) {
    const roleData = roleDoc.data();
    const role = roleData.role;

    if (role === "admin" || role === "superadmin") {
      statusBox.innerText = "Akun admin terdeteksi. Membuka panel admin...";
      window.location.href = "admin.html?v=role1";
      return;
    }
  }

  /*
    Jika bukan admin, render dashboard pelamar.
  */
  renderJobs();
  await cekLamaranPeriode();
});

/*
  ================================
  6. TAMPILKAN LOWONGAN
  ================================
*/
function renderJobs() {
  jobsBox.innerHTML = "";

  jobs.forEach(job => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${job.nama}</h3>
      <p>${job.deskripsi}</p>
      <button class="apply-btn" onclick="applyJob('${job.id}', '${job.nama}')">
        Apply
      </button>
    `;

    jobsBox.appendChild(card);
  });

  statusBox.innerText = "Siap.";
}

/*
  ================================
  7. CEK LAMARAN PERIODE
  ================================
  Hard lock:
  Dokumen lamaran memakai ID = UID_PERIODE_ID.
*/
async function cekLamaranPeriode() {
  const lamaranId = currentUser.uid + "_" + PERIODE_ID;
  const docSnap = await db.collection("lamaran").doc(lamaranId).get();

  if (docSnap.exists) {
    const data = docSnap.data();

    disableApplyButtons();

    statusBox.innerText =
      "Kamu sudah melamar " + data.lowongan + " pada periode ini.";
  }
}

/*
  ================================
  8. APPLY LOWONGAN
  ================================
  User hanya bisa apply jika belum punya dokumen:
  lamaran/{UID_PERIODE_ID}
*/
async function applyJob(jobId, jobName) {
  if (!currentUser) {
    statusBox.innerText = "Belum login.";
    return;
  }

  const lamaranId = currentUser.uid + "_" + PERIODE_ID;
  const lamaranRef = db.collection("lamaran").doc(lamaranId);

  try {
    statusBox.innerText = "Mengecek lamaran aktif...";

    const docSnap = await lamaranRef.get();

    if (docSnap.exists) {
      const data = docSnap.data();

      disableApplyButtons();

      statusBox.innerText =
        "Kamu sudah melamar " + data.lowongan + " pada periode ini.";
      return;
    }

    /*
      set() memakai ID tetap.
      Ini mencegah user membuat banyak lamaran dalam periode yang sama.
    */
    await lamaranRef.set({
      uid: currentUser.uid,
      email: currentUser.email,

      periodeId: PERIODE_ID,
      periodeNama: PERIODE_NAMA,

      lowonganId: jobId,
      lowongan: jobName,

      status: "aktif",
      tahap: "menunggu_review_berkas",

      createdAt: new Date(),
      updatedAt: new Date()
    });

    disableApplyButtons();

    statusBox.innerText =
      "✅ Lamaran " + jobName + " berhasil dikirim.";

  } catch (error) {
    statusBox.innerText = "Error: " + error.message;
  }
}

/*
  ================================
  9. MATIKAN SEMUA TOMBOL APPLY
  ================================
*/
function disableApplyButtons() {
  document.querySelectorAll(".apply-btn").forEach(btn => {
    btn.innerText = "Sudah melamar";
    btn.disabled = true;
  });
}
</script>

</body>
</html>
