<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard SIMPEL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body { font-family: Arial; background:#f2f2f2; padding:20px; }
    h2 { margin-bottom:10px; }
    .card { background:white; padding:18px; margin-bottom:15px; border-radius:12px; }
    button { background:#2a9d8f; color:white; border:none; padding:10px 14px; border-radius:7px; font-weight:bold; }
    button:disabled { background:#9ca3af; }
    #status { margin-top:16px; font-weight:bold; }
  </style>
</head>

<body>

<h2>Dashboard Lowongan</h2>
<p id="userInfo">Memuat user...</p>
<p><strong>Periode:</strong> UAT Mei 2026</p>

<a href="lamaran.html?v=periode2">
  <button>Lihat Lamaran Saya</button>
</a>

<div class="card">
  <h3>Purchasing</h3>
  <p>Mengelola proses pembelian dan administrasi vendor.</p>
  <button class="apply-btn" id="btn-purchasing" onclick="applyJob('purchasing', 'Purchasing')">Apply</button>
</div>

<div class="card">
  <h3>QC Line Assembling</h3>
  <p>Melakukan pemeriksaan kualitas pada line assembling.</p>
  <button class="apply-btn" id="btn-qc-line-assembling" onclick="applyJob('qc-line-assembling', 'QC Line Assembling')">Apply</button>
</div>

<div class="card">
  <h3>Staff IT</h3>
  <p>Mengelola sistem internal perusahaan.</p>
  <button class="apply-btn" id="btn-staff-it" onclick="applyJob('staff-it', 'Staff IT')">Apply</button>
</div>

<div id="status">Siap.</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const PERIODE_ID = "uat-2026-05";
const PERIODE_NAMA = "UAT Mei 2026";

const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90",
  measurementId: "G-NRWP6W84QE"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const statusBox = document.getElementById("status");

let currentUser = null;

auth.onAuthStateChanged(async function(user) {
  if (!user) {
    alert("Belum login.");
    window.location.href = "index.html?v=periode2";
    return;
  }

  currentUser = user;
  document.getElementById("userInfo").innerText = "Login sebagai: " + user.email;

  await cekLamaranPeriode();
});

function disableSemuaTombol(teks = "Sudah melamar") {
  document.querySelectorAll(".apply-btn").forEach(btn => {
    btn.innerText = teks;
    btn.disabled = true;
  });
}

async function cekLamaranPeriode() {
  const lamaranId = currentUser.uid + "_" + PERIODE_ID;
  const docSnap = await db.collection("lamaran").doc(lamaranId).get();

  if (docSnap.exists) {
    const data = docSnap.data();
    disableSemuaTombol();
    statusBox.innerText = "Kamu sudah melamar " + data.lowongan + " pada periode ini.";
  }
}

async function applyJob(jobId, jobName) {
  if (!currentUser) {
    statusBox.innerText = "Belum login.";
    return;
  }

  const lamaranId = currentUser.uid + "_" + PERIODE_ID;
  const docRef = db.collection("lamaran").doc(lamaranId);

  try {
    statusBox.innerText = "Mengecek lamaran periode aktif...";

    const docSnap = await docRef.get();

    if (docSnap.exists) {
      const data = docSnap.data();
      disableSemuaTombol();
      statusBox.innerText = "Kamu sudah melamar " + data.lowongan + " pada periode ini.";
      return;
    }

    await docRef.set({
      uid: currentUser.uid,
      email: currentUser.email,
      periodeId: PERIODE_ID,
      periodeNama: PERIODE_NAMA,
      lowonganId: jobId,
      lowongan: jobName,
      status: "aktif",
      tahap: "menunggu_review_berkas",
      createdAt: new Date()
    });

    disableSemuaTombol();
    statusBox.innerText = "✅ Lamaran " + jobName + " berhasil dikirim.";

  } catch (err) {
    statusBox.innerText = "Error: " + err.message;
  }
}
</script>

</body>
</html>
