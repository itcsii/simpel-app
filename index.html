<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPEL</title>
  <style>
    body { font-family: Arial; background:#f4f6f8; padding:20px; }
    .card { max-width:400px; margin:60px auto; background:white; padding:20px; border-radius:12px; text-align:center; }
    input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; }
    button { padding:10px; margin:5px; border:none; border-radius:8px; background:#14b8a6; color:white; }
    #status { margin-top:10px; font-size:14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>SIMPEL</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Daftar</button>
  <button onclick="login()">Login</button>

  <div id="status">Siap...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const status = document.getElementById("status");

window.register = async () => {
  try {
    await createUserWithEmailAndPassword(auth, email.value, password.value);
    status.innerText = "✅ Daftar berhasil";
  } catch (e) {
    status.innerText = "❌ " + e.message;
  }
};

window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    status.innerText = "✅ Login berhasil";
  } catch (e) {
    status.innerText = "❌ " + e.message;
  }
};
</script>

</body>
</html>
