<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMPEL</title>

<style>
body {
  font-family: Arial;
  background:#f4f6f8;
  padding:20px;
}

.card {
  max-width:400px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  text-align:center;
}

input {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

button {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:6px;
  background:#26a69a;
  color:white;
  font-weight:bold;
}

#status {
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>SIMPEL</h2>

  <input id="nama" placeholder="Nama">
  <input id="nik" placeholder="NIK">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="daftar()">Daftar</button>
  <button onclick="login()">Login</button>

  <div id="status">⏳ Mengecek koneksi Firebase...</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  addDoc,
  collection
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnMRf89zxUSz26-ij5V1-LGqjjpWezFJU",
  authDomain: "simpel-app-b3d9a.firebaseapp.com",
  projectId: "simpel-app-b3d9a",
  storageBucket: "simpel-app-b3d9a.firebasestorage.app",
  messagingSenderId: "562920025009",
  appId: "1:562920025009:web:c3cf438ce4fd2e0bffab90"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const status = document.getElementById("status");

status.innerText = "✅ Firebase siap";

window.daftar = async () => {
  const nama = document.getElementById("nama").value;
  const nik = document.getElementById("nik").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!nama || !nik || !email || !password) {
    status.innerText = "❌ Semua field wajib diisi";
    return;
  }

  try {
    // auth
    const user = await createUserWithEmailAndPassword(auth, email, password);

    // firestore
    await addDoc(collection(db, "pelamar"), {
      nama,
      nik,
      email,
      uid: user.user.uid,
      createdAt: new Date()
    });

    status.innerText = "✅ Daftar berhasil & data tersimpan";
  } catch (e) {
    status.innerText = "❌ " + e.message;
  }
